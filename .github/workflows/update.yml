name: Update magic numbers

on:
  schedule:
    # Hourly baseline (UTC).
    - cron: '0 * * * *'
    # Every 15 minutes during the 6 PM - 1 AM CT window, when games finish.
    - cron: '*/15 23,0,1,2,3,4,5,6 * * *'
  workflow_dispatch:

# Required so the job can commit the refreshed data back to the repo.
permissions:
  contents: write

concurrency:
  group: update-magic-numbers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the magic number math
        run: npm test

      - name: Fetch standings and recompute
        run: node scripts/update.js

      - name: Upload debug output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-raw
          path: data/_debug-raw.json
          if-no-files-found: ignore

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change in the standings; nothing to commit."
          else
            git commit -m "Update magic numbers ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
