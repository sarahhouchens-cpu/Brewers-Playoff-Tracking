name: Update bet board

# Four runs a day, not hourly.
#
# The Odds API free tier allows 500 credits a month and charges one credit per
# market per region. Three markets means three credits per run, so four runs a
# day costs about 360 a month and leaves headroom. Running this hourly like the
# standings job would spend the entire month in under two days.
#
# Times are chosen around a typical MLB schedule in Central time: late morning
# for early lines, then afternoon and two evening passes as lineups are posted
# and prices firm up.
# Slots are dense because most of them are free. A run after first pitch
# returns before the odds call, and a run more than five hours out skips it —
# so credits are only spent in the window where lineups are posted and prices
# are real. That covers a 1:10 PM Sunday game and a 7:10 PM weeknight with one
# schedule, instead of assuming every game starts in the evening.
on:
  schedule:
    - cron: '0 14 * * *'   #  9:00 AM CT
    - cron: '0 16 * * *'   # 11:00 AM CT
    - cron: '0 18 * * *'   #  1:00 PM CT
    - cron: '0 20 * * *'   #  3:00 PM CT
    - cron: '30 21 * * *'  #  4:30 PM CT
    - cron: '0 23 * * *'   #  6:00 PM CT
    - cron: '0 1 * * *'    #  8:00 PM CT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bet-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify the betting math
        run: npm test

      - name: Build the board
        run: node scripts/props.js
        env:
          ODDS_API_KEY: ${{ secrets.TheOdds_API_Key }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Board unchanged; nothing to commit."
          else
            git commit -m "Update bet board ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
